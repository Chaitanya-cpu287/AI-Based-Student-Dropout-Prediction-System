<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Student Dropout Prediction System</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Phosphor Icons (lightweight icon set) -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
</head>
<body class="login-page">

  <div class="login-container">

    <!-- Brand -->
    <div class="login-brand" aria-hidden="true">
      <div class="brand-icon">🎓</div>
      <h1>EduGuard</h1>
      <p>Student Dropout Prediction System</p>
    </div>

    <!-- Card -->
    <div class="login-card" role="main">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in with your mentor credentials to continue.</p>

      <div class="form-group">
        <label for="mentor-id">Mentor ID</label>
        <div class="input-wrap">
          <input
            type="text"
            id="mentor-id"
            placeholder="e.g. M301"
            autocomplete="username"
            spellcheck="false"
          />
          <span class="input-icon">
            <i class="ph ph-identification-card"></i>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <span class="input-icon">
            <i class="ph ph-lock-simple"></i>
          </span>
        </div>
      </div>

      <button class="btn-login" id="login-btn" type="button">
        <span class="btn-label">Sign In</span>
      </button>

      <div style="margin-top: 18px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px; font-size: 12px; color: #7a8fad; text-align: center;">
        <span style="display:block; margin-bottom: 6px; font-weight:600; color:#38bdf8;">🚀 Quick Demo Mentor:</span>
        <span style="display:inline-block; padding: 4px 12px; background: rgba(56,189,248,0.15); border-radius: 8px; cursor: pointer; color:#e8edf7;" onclick="document.getElementById('mentor-id').value='MNT101'; document.getElementById('password').value='mentor123';">Fill: MNT101 / mentor123</span>
      </div>

      <div class="error-msg hidden" id="error-msg" role="alert">
        <i class="ph ph-warning-circle"></i>
        <span id="error-text">Invalid credentials. Please try again.</span>
      </div>
    </div>

  </div>

  <script src="../config.js"></script>
  <script src="login.js"></script>
</body>
</html>
