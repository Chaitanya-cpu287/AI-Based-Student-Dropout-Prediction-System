<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Student Dropout Prediction</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="brand-icon">🎓</div>
        <div>
          <h1>DropoutShield</h1>
          <span>Prediction System</span>
        </div>
      </div>

      <!-- Heading -->
      <h2 class="login-title">Admin Login</h2>
      <p class="login-subtitle">Sign in to manage students and mentors</p>

      <!-- Alert area -->
      <div id="alert-area"></div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="admin_id">Admin ID</label>
          <input
            type="text"
            id="admin_id"
            placeholder="e.g. A101"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          Sign In
        </button>

        <div style="margin-top: 18px; padding: 12px; background: var(--surface-2); border: 1px dashed var(--border); border-radius: 8px; font-size: 12px; color: var(--text-dim); text-align: center;">
          <span style="display:block; margin-bottom: 6px; font-weight:600; color:var(--primary);">🚀 Quick Demo Admin:</span>
          <span style="display:inline-block; padding: 4px 12px; background: rgba(99,102,241,0.15); border-radius: 6px; cursor: pointer; color:var(--text);" onclick="document.getElementById('admin_id').value='admin'; document.getElementById('password').value='admin123';">Fill: admin / admin123</span>
        </div>
      </form>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="login.js"></script>
</body>
</html>
